name: radar
on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 min (min GitHub = 5 min, retards possibles)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python radar.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Sauvegarde de l'état
        run: |
          git config user.name radar
          git config user.email radar@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "state" && git push)
