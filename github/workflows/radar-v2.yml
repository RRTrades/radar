name: radar-v2-research
on:
  schedule:
    - cron: '7,27,47 * * * *'
    - cron: '13 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ne pas envoyer de message Telegram'
        required: false
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: radar-v2-state
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements-v2.txt
      - name: Test
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Scan and review queue
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "$EVENT_SCHEDULE" = '13 5 * * *' ]; then ARGS="$ARGS --daily"; fi
          python radar_v2.py $ARGS
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-v2-diagnostic
          path: radar_v2_report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Persist research state
        if: success()
        run: |
          git config user.name 'radar-v2[bot]'
          git config user.email 'radar-v2@users.noreply.github.com'
          git add radar_v2_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update radar v2 research state [skip ci]'
            git push
          fi
